<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2ebe3" />

    <!-- This file is shared by the public site and the private dashboard, so
         the defaults below describe the PUBLIC site — that is what clients and
         search engines see. App.jsx overrides the title and applies a noindex
         tag at runtime when the dashboard renders. -->
    <title>Paige Camryn — Luxury Event Harpist | Southern California</title>
    <meta name="description" content="Live harp music for weddings, ceremonies, and private events across Southern California. Over a decade of performances, with a custom song list tailored to your event." />

    <link rel="icon" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Paige Camryn — Luxury Event Harpist" />
    <meta property="og:description" content="Live harp music for weddings, ceremonies, and private events across Southern California." />
    <meta property="og:image" content="/photos/paige-meadow.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded here rather than via @import in styles.css: an @import inside a
         stylesheet is discovered late and blocks rendering twice over. These
         are the two families the app actually uses, plus Playfair for the
         handful of headings that still call for it. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
