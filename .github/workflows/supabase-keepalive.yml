name: Supabase Keep-Alive

# Backup to the daily Vercel cron (/api/keepalive). Does a real database read —
# the old /auth/v1/health ping never touched Postgres, so it did not count as
# activity. Note: GitHub disables scheduled workflows after 60 days without a
# commit; the Vercel cron is the one to rely on.
on:
  schedule:
    - cron: '0 12 */2 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row from Supabase
        run: |
          curl -sS --fail-with-body -w "\nHTTP STATUS: %{http_code}\n" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/repertoire?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
